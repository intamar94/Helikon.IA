<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helikon.IA — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12; --panel:#12161F; --panel-2:#171C27; --line:#232938;
    --text:#E7EAF0; --muted:#77808F; --muted-2:#4E5563;
    --broken:#FF5C5C; --ok:#34D399; --amber:#F5B142; --accent:#6E8CFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:760px;margin:0 auto;padding:16px 14px 60px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .brand{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);}
  .brand b{color:var(--text);}
  .stat{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);}

  .progressbar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .progressfill{height:100%;background:var(--ok);border-radius:3px;transition:width .3s;}

  .rama{margin-bottom:18px;}
  .rama-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .nodos{display:flex;flex-wrap:wrap;gap:8px;}

  .nodo{
    border:1px solid var(--line); border-radius:9px; padding:9px 12px;
    background:var(--panel); cursor:pointer; min-width:132px; flex:1 1 45%;
  }
  .nodo.dominado{border-color:rgba(52,211,153,.4); background:rgba(52,211,153,.06);}
  .nodo.disponible{border-color:rgba(110,140,255,.5);}
  .nodo.bloqueado{opacity:.4; cursor:not-allowed;}
  .nodo .num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted-2);}
  .nodo .nom{font-size:12.5px;font-weight:500;margin-top:2px;}
  .nodo .estado{font-family:'IBM Plex Mono',monospace;font-size:9.5px;margin-top:4px;}
  .nodo.dominado .estado{color:var(--ok);}
  .nodo.disponible .estado{color:var(--accent);}
  .nodo.bloqueado .estado{color:var(--muted-2);}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10;}
  .overlay.open{display:flex;}
  .sheet{
    background:var(--panel); border:1px solid var(--line); border-top-left-radius:16px; border-top-right-radius:16px;
    max-width:760px; width:100%; padding:20px 18px 24px; max-height:85vh; overflow-y:auto;
  }
  .sheet-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .sheet-title{font-size:18px;font-weight:600;margin-bottom:14px;}
  .campo{margin-bottom:12px;}
  .campo .k{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
  .campo .v{font-size:13px;line-height:1.5;color:var(--text);}
  .prereq-list{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:14px;}

  .btn{display:block;width:100%;background:var(--accent);color:#0A0D12;border:none;border-radius:8px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;margin-top:6px;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn:disabled{opacity:.4;}
  .close{position:absolute;top:14px;right:16px;color:var(--muted);font-size:20px;cursor:pointer;background:none;border:none;}
  .sheet{position:relative;}

  .footnote{text-align:center;font-size:11px;color:var(--muted-2);margin-top:16px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

const dominados = new Set();

function estadoDe(nodo){
  if(dominados.has(nodo.id)) return 'dominado';
  const prereqsOk = nodo.prerequisitos.every(p => dominados.has(p));
  return prereqsOk ? 'disponible' : 'bloqueado';
}

function render(){
  const ramas = {};
  NODOS.forEach(n => { (ramas[n.rama] = ramas[n.rama] || []).push(n); });

  const cont = document.getElementById('ramas');
  cont.innerHTML = Object.entries(ramas).map(([rama, nodos]) => `
    <div class="rama">
      <div class="rama-title">${rama}</div>
      <div class="nodos">
        ${nodos.map(n => {
          const est = estadoDe(n);
          const disabled = est === 'bloqueado' ? 'onclick=""' : `onclick="openSheet('${n.id}')"`;
          const label = est === 'dominado' ? '✓ dominado' : est === 'disponible' ? '● disponible' : '○ bloqueado';
          return `<div class="nodo ${est}" ${disabled}>
            <div class="num">${String(n.numero).padStart(2,'0')}</div>
            <div class="nom">${n.nombre}</div>
            <div class="estado">${label}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');

  const total = NODOS.length;
  const done = dominados.size;
  document.getElementById('statTxt').textContent = `${done}/${total} dominados`;
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
}

function openSheet(id){
  const n = NODOS.find(x => x.id === id);
  const est = estadoDe(n);
  if(est === 'bloqueado') return;

  const prereqNames = n.prerequisitos.map(p => NODOS.find(x=>x.id===p)?.nombre).join(', ') || 'ninguno';

  document.getElementById('sheetContent').innerHTML = `
    <div class="sheet-eyebrow">Reto ${String(n.numero).padStart(2,'0')} · ${n.rama}</div>
    <div class="sheet-title">${n.nombre}</div>
    <div class="prereq-list">Prerrequisitos: ${prereqNames}</div>
    <div class="campo"><div class="k">🎯 Objetivo</div><div class="v">${n.objetivo || '—'}</div></div>
    ${n.construir ? `<div class="campo"><div class="k">Construir</div><div class="v">${n.construir}</div></div>` : ''}
    ${n.romper ? `<div class="campo"><div class="k">Romper</div><div class="v">${n.romper}</div></div>` : ''}
    ${n.resolver ? `<div class="campo"><div class="k">Resolver</div><div class="v">${n.resolver}</div></div>` : ''}
    <button class="btn" id="domBtn" onclick="marcarDominado('${n.id}')" ${est==='dominado'?'disabled':''}>
      ${est === 'dominado' ? '✓ Ya dominado' : 'Marcar como dominado'}
    </button>
  `;
  document.getElementById('overlay').classList.add('open');
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
}

function marcarDominado(id){
  dominados.add(id);
  closeSheet();
  render();
}

render();
</script>
</body>
</html>
